# ============================================================================
# The Bear Cave — Slim Media Stack
# ============================================================================
# 9 always-on services (2026-09-03: Bazarr re-adopted per docs/services/lifecycle.md):
# prowlarr, radarr, sonarr, bazarr, nzbdav, nzbdav_rclone, seerr, plex, unpackerr.
# ImageMaid is available separately through the manual `maintenance` profile.
# Direct host ports (no Traefik). Full retirement record:
# docs/services/lifecycle.md
# ============================================================================

x-ca-env: &ca-env
  SSL_CERT_FILE: /etc/ssl/certs/mkcert/ca-bundle.pem
  CURL_CA_BUNDLE: /etc/ssl/certs/mkcert/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/mkcert/ca-bundle.pem
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/mkcert/rootCA.pem

x-ca-mount: &ca-mount
  source: ./config/ca
  target: /etc/ssl/certs/mkcert
  type: bind
  read_only: true

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  cpus: "0.5"
  environment: &common-env
    <<: *ca-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  logging: &common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "10"

networks:
  bearcave:
    name: bearcave

services:
  # ==========================================================================
  # Indexing — Prowlarr
  # ==========================================================================
  prowlarr:
    <<: *common
    image: ghcr.io/hotio/prowlarr:release-2.5.2.5491
    container_name: prowlarr
    mem_limit: 512m
    networks: [bearcave]
    ports:
      - "9696:9696"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - *ca-mount
      - ./config/prowlarr:/config

  # ==========================================================================
  # *arr apps — Radarr / Sonarr
  # ==========================================================================
  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release-6.3.0.10514
    container_name: radarr
    mem_limit: 1536m
    cpus: "1.5"
    networks: [bearcave]
    ports:
      - "7878:7878"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/radarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/movies:/data/movies

  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release-4.0.19.2979
    container_name: sonarr
    mem_limit: 1024m
    cpus: "1.5"
    networks: [bearcave]
    ports:
      - "8989:8989"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/sonarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/shows:/data/shows

  # ==========================================================================
  # Usenet — InfiniDysk (nzbdav) + rclone FUSE sidecar
  # ==========================================================================
  nzbdav:
    <<: *common
    image: ghcr.io/infinidysk/infinidysk@sha256:8cf616c1806c3443e6cfbd4b10bf7562d0e09cdfe735360c2e992f3a0c623dd0
    container_name: nzbdav
    mem_limit: 2560m
    cpus: "2.0"
    networks: [bearcave]
    depends_on:
      prowlarr:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - *ca-mount
      - ./config/nzbdav:/config
      - /mnt:/mnt
      - ./media:/media:ro
    environment:
      <<: *common-env
      FRONTEND_BACKEND_API_KEY: ${FRONTEND_BACKEND_API_KEY}
      NZBDAV_CONFIG__API__KEY: ${FRONTEND_BACKEND_API_KEY}
      NZBDAV_CONFIG__API__CATEGORIES: "tv,movies"
      NZBDAV_CONFIG__API__IMPORT_STRATEGY: "symlinks"
      NZBDAV_CONFIG__WEBDAV__USER: ${NZBDAV_WEBDAV_USER}
      NZBDAV_CONFIG__WEBDAV__PASS: ${NZBDAV_WEBDAV_PASS}
      NZBDAV_CONFIG__RCLONE__MOUNT_DIR: "/mnt/remote/nzbdav"
      NZBDAV_CONFIG__MEDIA__LIBRARY_DIR: "/media"
      NZBDAV_CONFIG__USENET__PROVIDERS: >-
        {"Providers":[{"Type":1,"Host":"${NZBDAV_USENET_HOST}","Port":${NZBDAV_USENET_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_USER}","Pass":"${NZBDAV_USENET_PASS}","MaxConnections":50,"Priority":0,"Nickname":"primary"},{"Type":1,"Host":"${NZBDAV_USENET_BACKUP_HOST}","Port":${NZBDAV_USENET_BACKUP_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_BACKUP_USER}","Pass":"${NZBDAV_USENET_BACKUP_PASS}","MaxConnections":50,"Priority":0,"Nickname":"backup"},{"Type":1,"Host":"${NZBDAV_USENET_EWEKA_HOST}","Port":${NZBDAV_USENET_EWEKA_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_EWEKA_USER}","Pass":"${NZBDAV_USENET_EWEKA_PASS}","MaxConnections":50,"Priority":0,"Nickname":"eweka"}]}
      NZBDAV_CONFIG__USENET__CASCADE__ENABLED: "true"
      NZBDAV_CONFIG__ARR__INSTANCES: >-
        {"RadarrInstances":[{"Host":"http://radarr:7878","ApiKey":"${RADARR_API_KEY}"}],"SonarrInstances":[{"Host":"http://sonarr:8989","ApiKey":"${SONARR_API_KEY}"}],"QueueRules":[]}
      NZBDAV_CONFIG__REPAIR__ENABLE: "true"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_DEPTH: "standard"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_AGING: "true"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_CONCURRENCY: "24"
      NZBDAV_CONFIG__REPAIR__AUTO_REMOVE_AFTER_FAILURES: "0"
      NZBDAV_CONFIG__REPAIR__AUTO_REMOVE_UNLINKED_ONLY: "true"
      NZBDAV_CONFIG__RCLONE__RC_ENABLED: "true"
      NZBDAV_CONFIG__RCLONE__HOST: "http://nzbdav_rclone:5572"
      NZBDAV_CONFIG__RCLONE__USER: "rclone"
      NZBDAV_CONFIG__RCLONE__PASS: ${NZBDAV_RCLONE_RC_PASS}
      NZBDAV_CONFIG__BACKUP__SCHEDULE_ENABLED: "true"
      NZBDAV_CONFIG__BACKUP__SCHEDULE_TIME: "120"
      NZBDAV_CONFIG__BACKUP__RETENTION_COUNT: "7"
      NZBDAV_CONFIG__MAINTENANCE__REMOVE_ORPHANED_SCHEDULE_ENABLED: "false"
      NZBDAV_CONFIG__MAINTENANCE__REMOVE_ORPHANED_SCHEDULE_TIME: "180"
      NZBDAV_CONFIG__QUEUE__WORKER_COUNT: "6"
      NZBDAV_CONFIG__USENET__SEGMENT_CACHE__ENABLED: "true"
      NZBDAV_CONFIG__USENET__SEGMENT_CACHE__MAX_GB: "20"
      NZBDAV_CONFIG__USENET__PIPELINING__ENABLED: "true"
      NZBDAV_CONFIG__USENET__PIPELINING__DEPTH: "8"
      NZBDAV_CONFIG__USENET__MAX_DOWNLOAD_CONNECTIONS_PER_STREAM: "true"
      NZBDAV_CONFIG__USENET__MAX_DOWNLOAD_CONNECTIONS_PER_STREAM_PRESET: "medium"
      NZBDAV_CONFIG__USENET__IN_FLIGHT_ARTICLE_BUDGET_MB: "2048"
      NZBDAV_CONFIG__API__ENSURE_IMPORTABLE_VIDEO: "true"
      NZBDAV_CONFIG__API__SAMPLE_FILTER_ENABLED: "true"
      NZBDAV_CONFIG__PROWLARR__URL: "http://prowlarr:9696"
      NZBDAV_CONFIG__PROWLARR__API_KEY: ${PROWLARR_API_KEY}
      NZBDAV_CONFIG__PROWLARR__SYNC_ENABLED: "true"
      NZBDAV_CONFIG__PROWLARR__SYNC_INTERVAL_MINUTES: "60"
      NZBDAV_CONFIG__PROFILES__INSTANCES: >-
        {"Profiles":[{"Token":"${NZBDAV_PROFILE_TOKEN}","Name":"Default","IndexerNames":[]}]}
      NZBDAV_CONFIG__PLAY__WATCHDOG_ENABLED: "true"
      NZBDAV_CONFIG__PLAY__VERIFY_MODE: "stat"
      NZBDAV_CONFIG__PREFLIGHT__MODE: "standard"
      NZBDAV_CONFIG__PREFLIGHT__MAX_ATTEMPTS: "8"
      NZBDAV_CONFIG__PREFLIGHT__INDEXER_MAX_WAIT_SECONDS: "3"
      NZBDAV_CONFIG__PREFLIGHT__TTL_SECONDS: "180"
      NZBDAV_CONFIG__WATCHTOWER__ENABLED: "true"
      NZBDAV_CONFIG__WATCHTOWER__PROFILE_TOKEN: ${NZBDAV_PROFILE_TOKEN}
      NZBDAV_CONFIG__WATCHTOWER__DAILY_RESOLVE_BUDGET: "15"
      NZBDAV_CONFIG__WATCHTOWER__GRAB_CAP_PER_RESOLVE: "2"
      NZBDAV_CONFIG__WATCHTOWER__RANKING: "largest"
      NZBDAV_CONFIG__WATCHTOWER__SEASON_BUNDLE_FALLBACK: "true"

  nzbdav_rclone:
    <<: *common
    image: rclone/rclone:1.75.0
    container_name: nzbdav_rclone
    # 4096m: the vfs metadata cache holds millions of entries (980k dirs + 1.1M
    # files for the ~132k-item library) during analysis; 3072m peaked at ~79%
    # RSS. Host has headroom (total caps ~11Gi against 22GiB).
    mem_limit: 4096m
    cpus: "2.0"
    networks: [bearcave]
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    volumes:
      - *ca-mount
      - /mnt/remote:/mnt/remote:rshared
      - ./config/nzbdav-rclone/rclone.conf:/config/rclone/rclone.conf
      - ./config/nzbdav-rclone/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/remote/nzbdav || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav:
        condition: service_healthy
        restart: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        fusermount3 -uz /mnt/remote/nzbdav 2>/dev/null || true;
        umount -l /mnt/remote/nzbdav 2>/dev/null || true;
        exec rclone
        mount nzbdav: /mnt/remote/nzbdav
        --cache-dir=/cache
        --uid=${PUID}
        --gid=${PGID}
        --allow-other
        --links
        --use-cookies
        --vfs-cache-mode=full
        # 100G: backing NVMe has ~250G free; the old 50G cap pinned the cache and
        # evicted boundary files during the 553GiB library-re-analysis pass.
        --vfs-cache-max-size=100G
        --vfs-cache-max-age=336h
        --buffer-size=0M
        --vfs-read-chunk-size=32M
        --vfs-read-chunk-size-limit=256M
        --vfs-read-ahead=32M
        --vfs-fast-fingerprint
        --no-checksum
        --attr-timeout=30s
        --dir-cache-time=6h
        --poll-interval=5m
        # 40s / 15s: absorb the 'net/http: timeout awaiting response headers'
        # errors seen when nzbdav is under concurrent analysis+stream load.
        --timeout=40s
        --contimeout=15s
        --low-level-retries=5
        --rc
        --rc-addr=:5572
        --rc-user=rclone
        --rc-pass=${NZBDAV_RCLONE_RC_PASS}

  # ==========================================================================
  # Subtitles — Bazarr (re-adopted 2026-09-03, fresh implementation)
  # ==========================================================================
  # Companion to Sonarr/Radarr: searches subtitle providers and delivers to the
  # media folders. Connection to both *arr apps is configured once in Bazarr's
  # web UI (Settings → Sonarr/Radarr, http://sonarr:8989 / http://radarr:7878 +
  # API keys) — Bazarr has no env-var settings surface. Mounts only READ paths:
  # it writes subtitles next to the media via the *arr apps' paths, never into
  # the mount internals, so it does not depend on the FUSE mount and is safe to
  # restart independently (landmines #2/#4 do not apply to it).
  bazarr:
    <<: *common
    image: ghcr.io/hotio/bazarr:release-1.6.0
    container_name: bazarr
    mem_limit: 768m
    cpus: "1.0"
    networks: [bearcave]
    ports:
      - "6767:6767"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      sonarr:
        condition: service_healthy
        restart: true
      radarr:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/bazarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/shows:/data/shows
      - ./media/movies:/data/movies

  # ==========================================================================
  # Requests — Seerr
  # ==========================================================================
  seerr:
    <<: *common
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: seerr
    mem_limit: 512m
    networks: [bearcave]
    ports:
      - "5055:5055"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - *ca-mount
      - ./config/seerr:/app/config

  # ==========================================================================
  # Manual Plex maintenance — ImageMaid
  # ==========================================================================
  # Profile-gated and excluded from the normal eight-service startup. This
  # removes generated PhotoTranscoder cache files only; it does not resize or
  # recompress artwork, remove metadata, empty trash, clean bundles, or touch
  # the media libraries.
  imagemaid:
    image: kometateam/imagemaid:latest@sha256:ac510622d44c8fd0024d28023ec2ce32f0992271ff019db455e227bd693f0052
    profiles: [maintenance]
    restart: "no"
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: "0.5"
    network_mode: none
    environment:
      TZ: ${TZ}
      PLEX_PATH: /plex
      MODE: nothing
      PHOTO_TRANSCODER: "True"
      EMPTY_TRASH: "False"
      CLEAN_BUNDLES: "False"
      OPTIMIZE_DB: "False"
      SCHEDULE: ""
      LOG_REQUESTS: "False"
    logging: *common-logging
    volumes:
      - ./config/imagemaid:/config
      - ./config/plex/Plex Media Server:/plex:rw

  # ==========================================================================
  # Media server — Plex (host network: GDM/DLNA/remote access)
  # ==========================================================================
  plex:
    image: plexinc/pms-docker@sha256:83a425ae9e133b1cb2cc3b809556e01c61cd8ff65c582e41b4374bc2210bac9e
    container_name: plex
    mem_limit: 2048m
    cpus: "4.0"
    restart: unless-stopped
    network_mode: host
    stop_grace_period: 90s
    logging: *common-logging
    environment:
      <<: *ca-env
      TZ: ${TZ}
      PLEX_UID: "955"
      PLEX_GID: "955"
      PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR: /config
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/plex:/config
      - ./config/plex-transcode:/transcode
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
    devices:
      - /dev/dri:/dev/dri

  # ==========================================================================
  # Queue management — Unpackerr
  # ==========================================================================
  unpackerr:
    <<: *common
    image: golift/unpackerr:v0.16.1
    container_name: unpackerr
    mem_limit: 64m
    cpus: "0.1"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "grep -aq unpackerr /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./usenet:/usenet
    environment:
      <<: *common-env
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
