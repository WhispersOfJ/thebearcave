# ============================================================================
# The Bear Cave — Unified Media Stack
# ============================================================================
# A single docker-compose.yml combining all services from media-stack and
# metacacharr into one cohesive, production-ready media infrastructure.
#
# Services: 22 containers
# - Indexing: Prowlarr
# - *arr apps: Radarr, Sonarr
# - Usenet: InfiniDysk (nzbdav) + rclone sidecar
# - Requests: Seerr
# - Media server: Plex (host network, VAAPI)
# - Metadata: Metacache (custom Plex metadata provider)
# - Queue mgmt: Unpackerr, Cleanuparr
# - Watch state: WatchState
# - Logging: Loki, Promtail, Grafana
# - Metrics: Prometheus, Node Exporter, cAdvisor, nzbdav-exporter
# - ARR dashboard: arr-dashboard
# - Landing page: Nginx
# - Reverse proxy: Traefik
# ============================================================================

x-ca-env: &ca-env
  # In-container CA trust: every service mounts ./config/ca read-only and
  # points its TLS stack at it. SSL_CERT_FILE / CURL_CA_BUNDLE / REQUESTS_CA_BUNDLE
  # REPLACE the bundle, so they get ca-bundle.pem (public CAs + mkcert root);
  # NODE_EXTRA_CA_CERTS appends, so it gets rootCA.pem alone.
  SSL_CERT_FILE: /etc/ssl/certs/mkcert/ca-bundle.pem
  CURL_CA_BUNDLE: /etc/ssl/certs/mkcert/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/mkcert/ca-bundle.pem
  NODE_EXTRA_CA_CERTS: /etc/ssl/certs/mkcert/rootCA.pem

x-ca-mount: &ca-mount
  source: ./config/ca
  target: /etc/ssl/certs/mkcert
  type: bind
  read_only: true

x-common: &common
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  mem_limit: 256m
  cpus: "0.5"
  environment: &common-env
    <<: *ca-env
    PUID: ${PUID}
    PGID: ${PGID}
    TZ: ${TZ}
  logging: &common-logging
    driver: json-file
    options:
      max-size: "10m"
      max-file: "10"

networks:
  bearcave:
    name: bearcave
  traefik:
    name: traefik

services:
  # ==========================================================================
  # Reverse Proxy — Traefik
  # ==========================================================================
  traefik:
    image: traefik:v3.7
    container_name: traefik
    mem_limit: 128m
    cpus: "0.25"
    restart: unless-stopped
    logging: *common-logging
    environment:
      <<: *ca-env
    networks: [bearcave, traefik]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - *ca-mount
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./config/traefik/dynamic:/etc/traefik/dynamic:ro
      - ./config/traefik/certs:/etc/traefik/certs:ro
      - traefik-certs:/certs
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`traefik.${HOST_IP}.nip.io`)"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.middlewares=auth"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.middlewares.auth.basicauth.users=${TRAEFIK_DASHBOARD_AUTH}"

  # ==========================================================================
  # Indexing
  # ==========================================================================
  prowlarr:
    <<: *common
    image: ghcr.io/hotio/prowlarr:release
    container_name: prowlarr
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - *ca-mount
      - ./config/prowlarr:/config
    ports:
      - "9696:9696"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"
      - "traefik.http.routers.prowlarr.tls=true"

  # ==========================================================================
  # *arr Apps
  # ==========================================================================
  radarr:
    <<: *common
    image: ghcr.io/hotio/radarr:release
    container_name: radarr
    mem_limit: 1g
    cpus: "1.0"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/radarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/movies:/data/movies
      - ./media/anime-movies:/data/anime-movies
    ports:
      - "7878:7878"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"
      - "traefik.http.routers.radarr.tls=true"

  sonarr:
    <<: *common
    image: ghcr.io/hotio/sonarr:release
    container_name: sonarr
    mem_limit: 2g
    cpus: "1.0"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/sonarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/shows:/data/shows
      - ./media/anime-shows:/data/anime-shows
    ports:
      - "8989:8989"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"
      - "traefik.http.routers.sonarr.tls=true"

  # ==========================================================================
  # Music & Books — Lidarr + Readarr
  # ==========================================================================
  lidarr:
    <<: *common
    image: ghcr.io/hotio/lidarr:nightly
    container_name: lidarr
    mem_limit: 512m
    cpus: "0.5"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/lidarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/music:/data/music
    ports:
      - "8686:8686"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lidarr.rule=Host(`lidarr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.lidarr.loadbalancer.server.port=8686"
      - "traefik.http.routers.lidarr.tls=true"

  readarr:
    <<: *common
    image: linuxserver/readarr:develop-0.4.18.2805-ls157
    container_name: readarr
    mem_limit: 256m
    cpus: "0.5"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8787/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/readarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/books:/data/books
    ports:
      - "8787:8787"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.readarr.rule=Host(`readarr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.readarr.loadbalancer.server.port=8787"
      - "traefik.http.routers.readarr.tls=true"

  # ==========================================================================
  # Subtitles — Bazarr
  # ==========================================================================
  bazarr:
    <<: *common
    image: ghcr.io/hotio/bazarr:release
    container_name: bazarr
    mem_limit: 128m
    cpus: "0.25"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/bazarr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
      - ./media/anime-movies:/data/anime-movies
      - ./media/anime-shows:/data/anime-shows
    ports:
      - "6767:6767"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"
      - "traefik.http.routers.bazarr.tls=true"

  # ==========================================================================
  # Usenet — InfiniDysk + rclone sidecar
  # ==========================================================================
  nzbdav:
    restart: unless-stopped
    logging: *common-logging
    image: ghcr.io/infinidysk/infinidysk:dev
    container_name: nzbdav
    mem_limit: 2g
    cpus: "1.0"
    networks: [bearcave]
    depends_on:
      prowlarr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:3000/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      <<: *ca-env
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      FRONTEND_BACKEND_API_KEY: ${FRONTEND_BACKEND_API_KEY}
      NZBDAV_CONFIG__API__KEY: ${FRONTEND_BACKEND_API_KEY}
      NZBDAV_CONFIG__API__CATEGORIES: "tv,movies,anime-movies,anime-shows"
      NZBDAV_CONFIG__API__IMPORT_STRATEGY: "symlinks"
      NZBDAV_CONFIG__WEBDAV__USER: ${NZBDAV_WEBDAV_USER}
      NZBDAV_CONFIG__WEBDAV__PASS: ${NZBDAV_WEBDAV_PASS}
      NZBDAV_CONFIG__RCLONE__MOUNT_DIR: "/mnt/remote/nzbdav"
      NZBDAV_CONFIG__MEDIA__LIBRARY_DIR: "/mnt/remote/nzbdav/completed-symlinks"
      NZBDAV_CONFIG__USENET__PROVIDERS: >-
        {"Providers":[{"Type":1,"Host":"${NZBDAV_USENET_HOST}","Port":${NZBDAV_USENET_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_USER}","Pass":"${NZBDAV_USENET_PASS}","MaxConnections":50,"Priority":0,"Nickname":"primary"},{"Type":1,"Host":"${NZBDAV_USENET_BACKUP_HOST}","Port":${NZBDAV_USENET_BACKUP_PORT},"UseSsl":true,"User":"${NZBDAV_USENET_BACKUP_USER}","Pass":"${NZBDAV_USENET_BACKUP_PASS}","MaxConnections":50,"Priority":0,"Nickname":"backup"}]}
      NZBDAV_CONFIG__USENET__CASCADE__ENABLED: "true"
      NZBDAV_CONFIG__ARR__INSTANCES: >-
        {"RadarrInstances":[{"Host":"http://radarr:7878","ApiKey":"${RADARR_API_KEY}"}],"SonarrInstances":[{"Host":"http://sonarr:8989","ApiKey":"${SONARR_API_KEY}"}],"QueueRules":[]}
      NZBDAV_CONFIG__REPAIR__ENABLE: "true"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_DEPTH: "standard"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_AGING: "true"
      NZBDAV_CONFIG__REPAIR__HEALTHCHECK_CONCURRENCY: "50"
      NZBDAV_CONFIG__REPAIR__AUTO_REMOVE_AFTER_FAILURES: "0"
      NZBDAV_CONFIG__REPAIR__AUTO_REMOVE_UNLINKED_ONLY: "true"
      NZBDAV_CONFIG__RCLONE__RC_ENABLED: "true"
      NZBDAV_CONFIG__RCLONE__HOST: "http://nzbdav_rclone:5572"
      NZBDAV_CONFIG__RCLONE__USER: "rclone"
      NZBDAV_CONFIG__RCLONE__PASS: ${NZBDAV_RCLONE_RC_PASS}
      NZBDAV_CONFIG__BACKUP__SCHEDULE_ENABLED: "true"
      NZBDAV_CONFIG__BACKUP__SCHEDULE_TIME: "120"
      NZBDAV_CONFIG__BACKUP__RETENTION_COUNT: "7"
      NZBDAV_CONFIG__MAINTENANCE__REMOVE_ORPHANED_SCHEDULE_ENABLED: "false"
      NZBDAV_CONFIG__MAINTENANCE__REMOVE_ORPHANED_SCHEDULE_TIME: "180"
      NZBDAV_CONFIG__QUEUE__WORKER_COUNT: "6"
      NZBDAV_CONFIG__USENET__SEGMENT_CACHE__ENABLED: "true"
      NZBDAV_CONFIG__USENET__SEGMENT_CACHE__MAX_GB: "20"
      NZBDAV_CONFIG__USENET__PIPELINING__ENABLED: "true"
      NZBDAV_CONFIG__USENET__PIPELINING__DEPTH: "8"
      NZBDAV_CONFIG__USENET__MAX_DOWNLOAD_CONNECTIONS_PER_STREAM: "true"
      NZBDAV_CONFIG__USENET__MAX_DOWNLOAD_CONNECTIONS_PER_STREAM_PRESET: "medium"
      NZBDAV_CONFIG__USENET__IN_FLIGHT_ARTICLE_BUDGET_MB: "2048"
      NZBDAV_CONFIG__API__ENSURE_IMPORTABLE_VIDEO: "true"
      NZBDAV_CONFIG__API__SAMPLE_FILTER_ENABLED: "true"
      NZBDAV_CONFIG__PROWLARR__URL: "http://prowlarr:9696"
      NZBDAV_CONFIG__PROWLARR__API_KEY: ${PROWLARR_API_KEY}
      NZBDAV_CONFIG__PROWLARR__SYNC_ENABLED: "true"
      NZBDAV_CONFIG__PROWLARR__SYNC_INTERVAL_MINUTES: "60"
      NZBDAV_CONFIG__PROFILES__INSTANCES: >-
        {"Profiles":[{"Token":"${NZBDAV_PROFILE_TOKEN}","Name":"Default","IndexerNames":[]}]}
      NZBDAV_CONFIG__PLAY__WATCHDOG_ENABLED: "true"
      NZBDAV_CONFIG__PLAY__VERIFY_MODE: "stat"
      NZBDAV_CONFIG__PREFLIGHT__MODE: "standard"
      NZBDAV_CONFIG__PREFLIGHT__MAX_ATTEMPTS: "8"
      NZBDAV_CONFIG__PREFLIGHT__INDEXER_MAX_WAIT_SECONDS: "3"
      NZBDAV_CONFIG__PREFLIGHT__TTL_SECONDS: "180"
      NZBDAV_CONFIG__WATCHTOWER__ENABLED: "true"
      NZBDAV_CONFIG__WATCHTOWER__PROFILE_TOKEN: ${NZBDAV_PROFILE_TOKEN}
      NZBDAV_CONFIG__WATCHTOWER__DAILY_RESOLVE_BUDGET: "15"
      NZBDAV_CONFIG__WATCHTOWER__GRAB_CAP_PER_RESOLVE: "2"
      NZBDAV_CONFIG__WATCHTOWER__RANKING: "largest"
      NZBDAV_CONFIG__WATCHTOWER__SEASON_BUNDLE_FALLBACK: "true"
    volumes:
      - *ca-mount
      - ./config/nzbdav:/config
      - /mnt:/mnt
    ports:
      - "3000:3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nzbdav.rule=Host(`nzbdav.${HOST_IP}.nip.io`)"
      - "traefik.http.services.nzbdav.loadbalancer.server.port=3000"
      - "traefik.http.routers.nzbdav.tls=true"

  nzbdav_rclone:
    image: rclone/rclone:latest
    container_name: nzbdav_rclone
    mem_limit: 1g
    cpus: "1.0"
    restart: unless-stopped
    logging: *common-logging
    networks: [bearcave]
    environment:
      <<: *ca-env
      TZ: ${TZ}
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    volumes:
      - *ca-mount
      - /mnt/remote:/mnt/remote:rshared
      - ./config/nzbdav-rclone/rclone.conf:/config/rclone/rclone.conf
      - ./config/nzbdav-rclone/cache:/cache
    healthcheck:
      test: ["CMD-SHELL", "mountpoint -q /mnt/remote/nzbdav || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav:
        condition: service_healthy
        restart: true
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        fusermount3 -uz /mnt/remote/nzbdav 2>/dev/null || true;
        umount -l /mnt/remote/nzbdav 2>/dev/null || true;
        exec rclone
        mount nzbdav: /mnt/remote/nzbdav
        --cache-dir=/cache
        --uid=${PUID}
        --gid=${PGID}
        --allow-other
        --links
        --use-cookies
        --vfs-cache-mode=full
        --vfs-cache-max-size=50G
        --vfs-cache-max-age=336h
        --buffer-size=0M
        --vfs-read-chunk-size=16M
        --vfs-read-chunk-size-limit=512M
        --no-checksum
        --dir-cache-time=1h
        --poll-interval=5m
        --timeout=30s
        --contimeout=15s
        --low-level-retries=3
        --rc
        --rc-addr=:5572
        --rc-user=rclone
        --rc-pass=${NZBDAV_RCLONE_RC_PASS}

  # ==========================================================================
  # Requests
  # ==========================================================================
  seerr:
    restart: unless-stopped
    logging: *common-logging
    image: ghcr.io/seerr-team/seerr
    container_name: seerr
    mem_limit: 512m
    cpus: "0.5"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      <<: *ca-env
      TZ: ${TZ}
    volumes:
      - *ca-mount
      - ./config/seerr:/app/config
    ports:
      - "5055:5055"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.seerr.rule=Host(`seerr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.seerr.loadbalancer.server.port=5055"
      - "traefik.http.routers.seerr.tls=true"

  # ==========================================================================
  # Media Server — Plex (host network, VAAPI)
  # ==========================================================================
  plex:
    restart: unless-stopped
    logging: *common-logging
    stop_grace_period: 90s
    image: plexinc/pms-docker:beta
    container_name: plex
    mem_limit: 2g
    cpus: "2.0"
    network_mode: host
    devices:
      - /dev/dri:/dev/dri
    environment:
      <<: *ca-env
      TZ: ${TZ}
      PLEX_UID: "955"
      PLEX_GID: "955"
      PLEX_MEDIA_SERVER_APPLICATION_SUPPORT_DIR: /config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:32400/identity || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/plex:/config
      - ./config/plex-transcode:/transcode
      - ./media/movies:/data/movies
      - ./media/shows:/data/shows
      - ./media/anime-movies:/data/anime-movies
      - ./media/anime-shows:/data/anime-shows
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - /dev/dri:/dev/dri
    # Note: Plex runs on host network for GDM/DLNA/remote access.
    # Traefik does NOT front Plex — it's accessed directly on port 32400.

  # ==========================================================================
  # Metadata — Metacache (custom Plex metadata provider)
  # ==========================================================================
  metacache:
    build:
      context: ./services/metacache
      dockerfile: Dockerfile
    container_name: metacache
    mem_limit: 256m
    cpus: "0.25"
    networks: [bearcave]
    restart: unless-stopped
    logging: *common-logging
    environment:
      <<: *ca-env
      TZ: ${TZ}
      Metacache__BindAddress: "0.0.0.0"
      Metacache__Port: "8765"
      Metacache__DataPath: "/app/data/metacache.db"
      Metacache__Upstream__BaseUrl: "https://api.themoviedb.org/3"
      Metacache__Tmdb__ApiKey: ${TMDB_KEY:-}
      Metacache__Upstream__ImageBaseUrl: "https://image.tmdb.org"
      Metacache__Tvdb__BaseUrl: "https://api.thetvdb.com"
      Metacache__Tvdb__ApiKey: ${TVDB_KEY:-}
      Metacache__Arr__RadarrUrl: "http://radarr:7878"
      Metacache__Arr__RadarrApiKey: ${RADARR_API_KEY:-}
      Metacache__Arr__SonarrUrl: "http://sonarr:8989"
      Metacache__Arr__SonarrApiKey: ${SONARR_API_KEY:-}
      Metacache__Warm__Languages__0: ${WARM_LANG_0:-en-US}
      Metacache__Auth__ApiKey: ${METACACHE_API_KEY:-}
    volumes:
      - *ca-mount
      - ./data/metacache:/app/data
    ports:
      - "8765:8765"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8765/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.metacache.rule=Host(`metacache.${HOST_IP}.nip.io`)"
      - "traefik.http.services.metacache.loadbalancer.server.port=8765"
      - "traefik.http.routers.metacache.tls=true"

  # ==========================================================================
  # ==========================================================================
  # ==========================================================================
  # Queue Management
  # ==========================================================================
  unpackerr:
    restart: unless-stopped
    logging: *common-logging
    # stable (0.15.2, 2026-03-08) carries 3 CRITICAL openssl CVEs, suppressed
    # in .trivyignore until golift rebuilds stable; the unstable tag's
    # /unpackerr binary ships non-executable (mode 644) so it cannot run.
    image: golift/unpackerr
    container_name: unpackerr
    mem_limit: 64m
    cpus: "0.1"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "grep -aq unpackerr /proc/[1-9]*/cmdline 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    environment:
      <<: *ca-env
      TZ: ${TZ}
      UN_RADARR_0_URL: http://radarr:7878
      UN_RADARR_0_API_KEY: ${RADARR_API_KEY}
      UN_SONARR_0_URL: http://sonarr:8989
      UN_SONARR_0_API_KEY: ${SONARR_API_KEY}
    volumes:
      - *ca-mount
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
      - ./usenet:/usenet

  cleanuparr:
    <<: *common
    image: ghcr.io/cleanuparr/cleanuparr:2.10.5
    container_name: cleanuparr
    mem_limit: 128m
    cpus: "0.25"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11011/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      nzbdav_rclone:
        condition: service_healthy
        restart: true
    volumes:
      - *ca-mount
      - ./config/cleanuparr:/config
      - /mnt/remote/nzbdav:/mnt/remote/nzbdav:rslave
    ports:
      - "11011:11011"

  # ==========================================================================
  # Watch State
  # ==========================================================================
  watchstate:
    restart: unless-stopped
    logging: *common-logging
    image: ghcr.io/arabcoders/watchstate:latest
    container_name: watchstate
    mem_limit: 256m
    cpus: "0.25"
    user: "${PUID}:${PGID}"
    environment:
      <<: *ca-env
      TZ: "${TZ}"
      WS_TZ: "${TZ}"
      WS_API_KEY: "${WS_API_KEY}"
      WS_SECURE_API_ENDPOINTS: "true"
      WS_SYSTEM_SECRET: "${WS_SYSTEM_SECRET}"
      WS_CRON_IMPORT: "true"
      WS_CRON_IMPORT_AT: "25 0-1,6-23 * * *"
      WS_CRON_EXPORT: "false"
    networks: [bearcave]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H \"X-apikey: $${WS_API_KEY}\" http://localhost:8080/v1/api/system/healthcheck || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - *ca-mount
      - ./config/watchstate:/config
    ports:
      - "8705:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watchstate.rule=Host(`watchstate.${HOST_IP}.nip.io`)"
      - "traefik.http.services.watchstate.loadbalancer.server.port=8080"
      - "traefik.http.routers.watchstate.tls=true"

  # ==========================================================================
  # Centralized Logging
  # ==========================================================================
  loki:
    restart: unless-stopped
    logging: *common-logging
    image: grafana/loki:3.7.6
    container_name: loki
    mem_limit: 512m
    cpus: "0.5"
    ports:
      - "3100:3100"
    volumes:
      - *ca-mount
      - ./config/loki/loki-config.yaml:/etc/loki/loki-config.yaml
      - ./data/loki:/loki
    command: -config.file=/etc/loki/loki-config.yaml
    environment:
      <<: *ca-env
      TZ: ${TZ}
    networks: [bearcave]
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  promtail:
    restart: unless-stopped
    logging: *common-logging
    image: grafana/promtail:3.6.11
    container_name: promtail
    mem_limit: 128m
    cpus: "0.25"
    healthcheck:
      test: ["CMD", "/usr/bin/promtail", "-check-syntax", "-config.file=/etc/promtail/config.yaml"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - *ca-mount
      # Promtail reads /var/lib/docker/containers directly (static_configs), so
      # it needs that volume mount but NOT the Docker socket, which it never
      # calls. Dropping the socket removes a root-equivalent host mount.
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ./config/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    environment:
      <<: *ca-env
      TZ: ${TZ}
    networks: [bearcave]
    depends_on:
      loki:
        condition: service_healthy
        restart: true

  grafana:
    restart: unless-stopped
    logging: *common-logging
    image: grafana/grafana:13.2.0
    container_name: grafana
    mem_limit: 512m
    cpus: "0.5"
    ports:
      - "3001:3000"
    volumes:
      - *ca-mount
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards
      - ./data/grafana:/var/lib/grafana
    environment:
      <<: *ca-env
      TZ: ${TZ}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-password123}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL}
    networks: [bearcave]
    depends_on:
      loki:
        condition: service_healthy
        restart: true
      prometheus:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${HOST_IP}.nip.io`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "traefik.http.routers.grafana.tls=true"

  # ==========================================================================
  # Metrics
  # ==========================================================================
  nzbdav-exporter:
    build: ./services/nzbdav-exporter
    restart: unless-stopped
    logging: *common-logging
    container_name: nzbdav-exporter
    mem_limit: 64m
    cpus: "0.1"
    networks: [bearcave]
    environment:
      <<: *ca-env
      NZBDAV_URL: "http://nzbdav:3000"
      NZBDAV_API_KEY: ${FRONTEND_BACKEND_API_KEY}
      SCRAPE_INTERVAL: "15"
    volumes:
      - *ca-mount
    depends_on:
      nzbdav:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    restart: unless-stopped
    logging: *common-logging
    image: prom/prometheus:latest
    container_name: prometheus
    mem_limit: 1g
    cpus: "1.0"
    ports:
      - "9090:9090"
    volumes:
      - *ca-mount
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./config/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml
      - ./data/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=2GB"
      - "--web.enable-lifecycle"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *ca-env
      TZ: ${TZ}
    networks: [bearcave]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  alertmanager:
    restart: unless-stopped
    logging: *common-logging
    image: prom/alertmanager:latest
    container_name: alertmanager
    mem_limit: 128m
    cpus: "0.25"
    ports:
      - "9093:9093"
    volumes:
      - ./config/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
      - ./data/alertmanager:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    environment:
      DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL}"
    networks: [bearcave]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  node-exporter:
    restart: unless-stopped
    logging: *common-logging
    image: prom/node-exporter:latest
    container_name: node-exporter
    mem_limit: 64m
    cpus: "0.1"
    pid: host
    network_mode: host
    healthcheck:
      # wget --spider sends HEAD and closes after headers; node-exporter's
      # promhttp handler still streams the full ~113KB /metrics body, so the
      # client's early close floods the logs with one "broken pipe" error per
      # metric family (~280 lines every 30s). Read the body to completion
      # instead — cheap (0.5s, 113KB) and error-free.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - *ca-mount
      - /proc:/host/proc
      - /sys:/host/sys
      - /:/rootfs
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--web.listen-address=:9100"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.netclass.ignored-devices=^(veth.*)$$"
      - "--collector.netdev.device-exclude=^(veth.*)$$"
    environment:
      <<: *ca-env
      TZ: ${TZ}

  cadvisor:
    restart: unless-stopped
    logging: *common-logging
    # gcr.io's cadvisor registry is deprecated (tags end at v0.55.1 and the
    # repo now publishes to GHCR); the stale gcr.io :latest carried 4
    # CRITICAL CVEs (openssl, grpc, stdlib). v0.60.5 scans clean.
    image: ghcr.io/google/cadvisor:v0.60.5
    container_name: cadvisor
    mem_limit: 512m
    cpus: "0.5"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    ports:
      - "8080:8080"
    volumes:
      - *ca-mount
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    environment:
      <<: *ca-env
      TZ: ${TZ}
    networks: [bearcave]
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ==========================================================================
  # ARR Dashboard
  # ==========================================================================
  arr-dashboard:
    image: khak1s/arr-dashboard:latest
    container_name: arr-dashboard
    mem_limit: 512m
    cpus: "0.5"
    restart: unless-stopped
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *ca-env
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      DATABASE_URL: file:/config/prod.db
      SESSION_TTL_HOURS: "24"
      LOG_LEVEL: info
    volumes:
      - *ca-mount
      - arr-dashboard-data:/config
    ports:
      - "41789:3000"
    networks: [bearcave]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arr-dashboard.rule=Host(`arr.${HOST_IP}.nip.io`)"
      - "traefik.http.services.arr-dashboard.loadbalancer.server.port=3000"
      - "traefik.http.routers.arr-dashboard.tls=true"

  # ==========================================================================
  # Landing Page
  # ==========================================================================
  landing-page:
    image: nginx:alpine
    container_name: landing-page
    mem_limit: 64m
    cpus: "0.1"
    restart: unless-stopped
    logging: *common-logging
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    environment:
      <<: *ca-env
      RADARR_API_KEY: ${RADARR_API_KEY}
      SONARR_API_KEY: ${SONARR_API_KEY}
      PROWLARR_API_KEY: ${PROWLARR_API_KEY}
      PLEX_TOKEN: ${PLEX_TOKEN}
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - *ca-mount
      - ./services/landing-page/index.html:/usr/share/nginx/html/index.html:ro
      - ./services/landing-page/service-registry.json:/usr/share/nginx/html/service-registry.json:ro
      - ./services/landing-page/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # Public root CA for device trust — exposes ONLY the cert, never the key
      - ./config/ca/rootCA.pem:/usr/share/nginx/html/rootCA.pem:ro
    ports:
      - "8000:80"
    networks: [bearcave]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.landing-page.rule=Host(`bearcave.${HOST_IP}.nip.io`)"
      - "traefik.http.services.landing-page.loadbalancer.server.port=80"
      - "traefik.http.routers.landing-page.tls=true"

# ==========================================================================
# Volumes
# ==========================================================================
volumes:
  traefik-certs:
  arr-dashboard-data:
