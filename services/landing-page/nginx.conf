server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Read-only API proxy for the landing page's live badge/status fetches.
    # Same-origin /api/ calls work over both HTTP and HTTPS (no mixed-content
    # blocking). Host is pinned to 127.0.0.1 so Django's ALLOWED_HOSTS accepts
    # it; the panel's VerifySameOriginMiddleware still rejects mutating
    # requests that claim localhost from a non-loopback client, so this proxy
    # only ever serves GETs — defense-in-depth stays intact.
    location /api/ {
        proxy_pass http://control-panel:8420;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }
}
