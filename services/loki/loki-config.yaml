auth_enabled: false

common:
  path_prefix: /loki
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1

ingester:
  chunk_idle_period: 3m
  max_chunk_age: 1h

schema_config:
  configs:
    # 3.x dropped boltdb-shipper (removed) in favor of tsdb; schema v13 is the
    # current version. Old 2.x chunks on disk are orphaned (not indexed) -
    # logs are transient, so no migration is attempted.
    - from: 2026-08-26
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h

server:
  http_listen_port: 3100
  log_level: info
  grpc_listen_port: 9095

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
