# ============================================================================
# The Bear Cave — Ansible inventory (example)
# ============================================================================
# Copy to ansible/hosts.yml and list your LAN devices, then run:
#   ./scripts/ansible-trust-ca.sh
#
# Linux / macOS targets: passwordless SSH from this server (ssh-copy-id).
# Windows targets:       WinRM configured per Ansible docs (README).
# ============================================================================
all:
  children:
    # Ubuntu/Debian desktops, HTPCs, Raspberry Pis, laptops…
    linux:
      hosts:
        laptop:
          ansible_host: 192.168.4.21
          ansible_user: bear
        # htpc:
        #   ansible_host: 192.168.4.22
        #   ansible_user: bear

    # macOS MacBooks / Mac minis
    macos:
      hosts:
        macbook:
          ansible_host: 192.168.4.23
          ansible_user: bear

    # Windows desktops — needs the ansible.windows collection + WinRM
    windows:
      hosts:
        desktop:
          ansible_host: 192.168.4.24
          ansible_connection: winrm
          ansible_user: bear
          ansible_winrm_transport: credssp
          ansible_become_user: SYSTEM

# Optional: import the CA into Firefox NSS stores on Linux/macOS targets
# (Firefox does not read the system store). Uncomment to enable for all hosts:
# all:
#   vars:
#     install_firefox_nss: true
