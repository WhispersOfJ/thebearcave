apiVersion: 1
groups:
    - orgId: 1
      name: Stack Health
      folder: Alerts
      interval: 1m
      rules:
        - uid: mount-drift-divergence
          title: Mount Drift Divergence
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: mount_drift_divergence{job="node-exporter"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: $A > 0
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: math
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The daily stack health check on the host reported mount drift. Run python3 scripts/check_mount_drift.py locally and restart the affected container(s).
            summary: Live container mounts diverge from compose or a FUSE handle is stale (Grafana)
          labels:
            severity: critical
          isPaused: false
