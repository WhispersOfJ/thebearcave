apiVersion: 1
groups:
    - orgId: 1
      name: Stack Health
      folder: Alerts
      interval: 1m
      rules:
        - uid: mount-drift-divergence
          title: Mount Drift Divergence
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: mount_drift_divergence{job="node-exporter"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: $A > 0
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: math
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The daily stack health check on the host reported mount drift. Run python3 scripts/check_mount_drift.py locally and restart the affected container(s).
            summary: Live container mounts diverge from compose or a FUSE handle is stale (Grafana)
          labels:
            severity: critical
          isPaused: false
        - uid: nzbdav-queue-divergence
          title: NzbDAV Queue Divergence
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: nzbdav_queue_divergence{job="node-exporter"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: $A > 0
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: math
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The daily stack health check on the host reported the nzbdav queue is non-empty. Do NOT recreate the nzbdav container — queued NZBs would be wiped and blocklisted. Run python3 scripts/check_nzbdav_queue.py locally for details.
            summary: NzbDAV queue is non-empty — recreate would destroy queued NZBs (Grafana)
          labels:
            severity: critical
          isPaused: false
        - uid: bind-mount-stale
          title: Bind Mount Stale
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: bind_mount_stale{job="node-exporter"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: $A > 0
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: math
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The daily stack health check on the host reported a stale bind-mount inode or stale content. A container is serving stale content because sed -i/vim changed the host inode without a restart. Run python3 scripts/check_bind_mount_staleness.py locally and docker compose restart the affected container(s).
            summary: A container is serving a stale bind-mount inode or stale content (Grafana)
          labels:
            severity: critical
          isPaused: false
        - uid: mcp-baseline-divergence
          title: MCP Baseline Divergence
          condition: B
          data:
            - refId: A
              relativeTimeRange:
                from: 300
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                expr: mcp_baseline_divergence{job="node-exporter"}
                instant: true
                intervalMs: 1000
                maxDataPoints: 43200
                refId: A
            - refId: B
              datasourceUid: __expr__
              model:
                expression: $A > 0
                intervalMs: 1000
                maxDataPoints: 43200
                refId: B
                type: math
          noDataState: NoData
          execErrState: Error
          for: 2m
          annotations:
            description: The daily stack health check on the host reported MCP baseline divergence from .github/mcp-baseline.json. Run python3 scripts/check_mcp.py --baseline locally for details.
            summary: MCP server state diverged from baseline (Grafana)
          labels:
            severity: critical
          isPaused: false
