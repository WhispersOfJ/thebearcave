global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Metacache - Custom Metadata Provider
  - job_name: "metacache"
    metrics_path: "/metrics/prometheus"
    static_configs:
      - targets: ["metacache:8765"]

  # NzbDAV streaming metrics (custom exporter sidecar)
  - job_name: "nzbdav-exporter"
    static_configs:
      - targets: ["nzbdav-exporter:9200"]

  # Host metrics via node-exporter (runs on host network, reached via host IP)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["host.docker.internal:9100"]

  # Container metrics via cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]

  # Docker daemon metrics (if Docker metrics endpoint is enabled)
  - job_name: "docker"
    static_configs:
      - targets: ["host.docker.internal:9323"]
    # Only scrape if Docker daemon has metrics enabled;
    # harmless 404 if not — just marks the target down.
    honor_labels: true
