# ============================================================================
# The Bear Cave — Traefik Static Configuration
# ============================================================================

# CrowdSec bouncer — in-process middleware plugin (spec §4.8). Traefik
# downloads the module at startup, then needs a restart (seconds-long route
# blip). Pinned to v1.7.1; bump deliberately.
experimental:
  plugins:
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1

# API
api:
  dashboard: true
  insecure: false

# Entry points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"

# Certificate resolvers — intentionally absent. This stack runs on a private
# LAN IP (nip.io hostnames), which Let's Encrypt can never validate, so ACME
# attempts would just spam errors and fall back to the self-signed default
# cert anyway. Routers enable TLS without a certresolver, so Traefik serves
# its built-in self-signed certificate — encrypted in transit, untrusted.
# To add real certs later: define a certificatesResolvers block here, set
# ACME_EMAIL, and re-add the tls.certresolver labels in docker-compose.yml.

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: bearcave
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100

# Health check — no entryPoint so /ping is on ALL entrypoints including
# the API port (8080), matching what `traefik healthcheck --ping` probes.
ping: {}
