# ============================================================================
# The Bear Cave — Traefik Static Configuration
# ============================================================================

# API
api:
  dashboard: true
  insecure: false

# Entry points
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    tls:
      certResolver: letsencrypt

# Certificate resolvers
certificatesResolvers:
  letsencrypt:
    acme:
      email: ${ACME_EMAIL:-admin@bearcave.local}
      storage: /certs/acme.json
      httpChallenge:
        entryPoint: web

# Providers
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: bearcave
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Logging
log:
  level: INFO

accessLog:
  filePath: /var/log/traefik/access.log
  bufferingSize: 100

# Health check — no entryPoint so /ping is on ALL entrypoints including
# the API port (8080), matching what `traefik healthcheck --ping` probes.
ping: {}
