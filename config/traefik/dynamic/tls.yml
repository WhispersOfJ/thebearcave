# ============================================================================
# The Bear Cave — Traefik Dynamic: Default Certificate
# ============================================================================
# Serves the mkcert-signed wildcard certificate (local CA, trusted on this
# host and any device with rootCA.pem installed) as the DEFAULT certificate.
# Every router with tls=true but no certresolver uses it, so all nip.io
# hostnames get a valid cert — no browser warning.
#
# Files: config/traefik/certs/bearcave.pem + bearcave-key.pem (gitignored).
# Regenerate with:
#   mkcert -cert-file config/traefik/certs/bearcave.pem \
#          -key-file config/traefik/certs/bearcave-key.pem \
#          "*.${HOST_IP}.nip.io" "${HOST_IP}" "localhost"
# Traefik hot-reloads this file (file provider watch=true) — no restart needed
# when only the cert files change; recreate the container if this file's shape
# changes.

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/bearcave.pem
        keyFile: /etc/traefik/certs/bearcave-key.pem
