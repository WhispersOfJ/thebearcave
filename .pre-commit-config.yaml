# Pre-commit hooks for The Bear Cave
# Install: pip install pre-commit && pre-commit install
# This file is the single source of truth: the same hook set runs locally
# and in CI (.github/workflows/pre-commit.yml) so an uninstalled local
# pre-commit cannot bypass the gates.
#
# Top-level exclude keeps reference material out of every hook, matching the
# ruff/quality/validate posture (archive/ is preserved, not maintained).
exclude: '^archive/'

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--exclude", "archive/**", "--exclude", "**/migrations/**"]

  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]
        # Mirrors validate.yml ignore_paths: these .sh files are library
        # sources without shebangs (SC2148 noise), not checked by CI either.
        exclude: "^(archive|config|services|data|media)/"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: ["--markdown-linebreak-ext=md"]
