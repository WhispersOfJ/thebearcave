name: Docker Publish

# Builds the metacache container image, pushes it to GHCR on main and version
# tags, and gates every run on Trivy CVE scans.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/metacache/**"
  schedule:
    - cron: "17 4 * * *" # nightly rebuild + CVE rescan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build · CVE scan · push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thebearcave-metacache
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern=nightly

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: services/metacache
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Tag for scanning
        run: |
          first_tag=$(echo "${{ steps.meta.outputs.tags }}" | cut -d, -f1)
          docker tag "$first_tag" metacache:ci

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: trivy-cache
          key: trivy-${{ runner.os }}-0.57.1

      - name: Trivy — image CVE scan (gate)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/scan" \
            -v "${{ github.workspace }}/trivy-cache:/root/.cache" \
            -w /scan \
            aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output /scan/trivy-image.sarif \
            --exit-code 1 \
            metacache:ci

      - name: Upload Trivy SARIF
        if: always() && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
