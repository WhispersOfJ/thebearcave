name: Docker Publish
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


# Builds the metacache container image, pushes it to GHCR on main and version
# tags, and gates every run on Trivy CVE scans.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/metacache/**"
  schedule:
    - cron: "17 4 * * *" # nightly rebuild + CVE rescan
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-push:
    name: Build · CVE scan · push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/thebearcave-metacache
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=schedule,pattern=nightly

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/metacache
          push: ${{ github.event_name != 'pull_request' }}
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Tag for scanning
        run: |
          # metadata-action joins tags with commas on branch/PR pushes but with
          # newlines when semver tags fire (release tag pushes). Normalize to
          # commas before taking the first tag.
          first_tag=$(printf '%s' "${{ steps.meta.outputs.tags }}" | tr '\n' ',' | cut -d, -f1)
          docker tag "$first_tag" metacache:ci

      - name: Cache Trivy DB
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: trivy-cache
          key: trivy-${{ runner.os }}-0.57.1

      - name: Trivy — image CVE scan (gate)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/scan" \
            -v "${{ github.workspace }}/trivy-cache:/root/.cache" \
            -w /scan \
            aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --format sarif \
            --output /scan/trivy-image.sarif \
            --exit-code 1 \
            metacache:ci

      - name: Upload Trivy SARIF
        if: always() && github.actor != 'dependabot[bot]'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-image.sarif
