name: Stale Issues and PRs
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  schedule:
    - cron: "30 1 * * *" # daily at 01:30 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639 # v9
        with:
          days-before-stale: 30
          days-before-close: 7
          stale-issue-label: "stale"
          stale-pr-label: "stale"
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not
            had activity in 30 days. It will be closed in 7 days if no further
            activity occurs.
          stale-pr-message: >
            This PR has been automatically marked as stale because it has not
            had activity in 30 days. It will be closed in 7 days if no further
            activity occurs.
          close-issue-message: "Closing due to inactivity. Feel free to reopen if still relevant."
          close-pr-message: "Closing due to inactivity. Feel free to reopen if still relevant."
          exempt-issue-labels: "pinned,security,bug-confirmed"
          exempt-pr-labels: "pinned,security,work-in-progress"
          exempt-all-milestones: true
