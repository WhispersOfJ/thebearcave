name: Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "**.yml"
      - "**.yaml"
      - "**.sh"
      - "docker-compose.yml"
      - "services/fish-functions/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yamllint
        run: python3 -m pip install yamllint==1.37.1
      - name: Lint YAML
        run: 'yamllint -d "{extends: relaxed, rules: {line-length: disable}}" docker-compose.yml .github/*.yml .github/workflows/*.yml'

  shell-and-python:
    name: Shell and Python Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bash syntax
        run: for f in scripts/*.sh tests/*/*.sh; do bash -n "$f"; done
      - name: Python checks
        run: |
          python3 -m py_compile scripts/*.py
          pip install ruff==0.8.6
          ruff check . --exclude archive/ --exclude "**/migrations"
      - name: Fish checks
        run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          for f in services/fish-functions/functions/*.fish services/fish-functions/completions/*.fish; do
            fish --no-execute "$f"
            fish_indent --check "$f"
          done
          ./tests/fish/test_fish_functions.sh --offline
