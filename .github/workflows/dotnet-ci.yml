name: .NET CI (Metacache)

on:
  push:
    branches: [main]
    paths:
      - "services/metacache/**"
  pull_request:
    paths:
      - "services/metacache/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build · Test · Format · CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metacache
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('services/metacache/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Metacache.slnx

      - name: Format (C# style gate)
        run: dotnet format Metacache.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build Metacache.slnx -c Release --no-restore -warnaserror

      - name: Test (with coverage)
        run: dotnet test Metacache.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: metacache-coverage
          path: services/metacache/TestResults
          if-no-files-found: ignore

      - name: NuGet CVE audit (vulnerable packages)
        run: dotnet list Metacache.slnx package --vulnerable --include-transitive

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build metacache image (no push)
        uses: docker/build-push-action@v7
        with:
          context: services/metacache
          push: false
          load: true
          tags: metacache:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Trivy scan — metacache image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/scan" \
            -w /scan \
            aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            metacache:ci || echo "⚠️  Trivy scan completed (non-blocking)"
