name: .NET CI (Metacache)
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  push:
    branches: [main]
    paths:
      - "services/metacache/**"
  pull_request:
    paths:
      - "services/metacache/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build · Test · Format · CVE audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/metacache
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('services/metacache/**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Metacache.slnx

      - name: Format (C# style gate)
        run: dotnet format Metacache.slnx --verify-no-changes --no-restore

      - name: Build (warnings as errors)
        run: dotnet build Metacache.slnx -c Release --no-restore -warnaserror

      - name: Test (with coverage)
        run: dotnet test Metacache.slnx -c Release --no-build --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && github.actor != 'dependabot[bot]'
        with:
          name: metacache-coverage
          path: services/metacache/TestResults
          if-no-files-found: ignore

      - name: NuGet CVE audit (vulnerable packages)
        run: dotnet list Metacache.slnx package --vulnerable --include-transitive

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build metacache image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: services/metacache
          push: false
          load: true
          tags: metacache:ci
          cache-from: type=gha
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,mode=max' || '' }}

      - name: Trivy scan — metacache image
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/scan" \
            -w /scan \
            aquasec/trivy:0.57.1 image \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 0 \
            metacache:ci || echo "⚠️  Trivy scan completed (non-blocking)"
