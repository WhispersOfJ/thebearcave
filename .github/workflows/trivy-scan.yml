name: Trivy Image Security Scan

on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Severity threshold"
        required: false
        default: "CRITICAL,HIGH"
        type: choice
        options: ["CRITICAL,HIGH", CRITICAL, "CRITICAL,HIGH,MEDIUM"]
  pull_request:
    paths: ["docker-compose.yml", ".github/workflows/trivy-scan.yml", ".trivyignore"]
  push:
    branches: [main]
    paths: ["docker-compose.yml", ".github/workflows/trivy-scan.yml", ".trivyignore"]
  schedule:
    - cron: "0 2 * * 0"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan active Compose images
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update
          sudo apt-get install -y trivy
      - name: Extract active images
        run: grep -oP '^\s+image:\s+\K[^\s\n]+' docker-compose.yml | sort -u | tee /tmp/images.txt
      - name: Scan images against baseline
        run: |
          set -euo pipefail
          baseline=.github/trivy-baseline.json
          regressions=0
          while IFS= read -r image; do
            result=$(trivy image --ignore-unfixed --scanners vuln --format json --severity "${{ inputs.severity || 'CRITICAL,HIGH' }}" "$image" 2>/dev/null || echo '{}')
            crit=$(echo "$result" | jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
            base=$(jq -r --arg image "$image" '.images[$image] // 0' "$baseline")
            echo "$image: CRITICAL=$crit baseline=$base"
            if [ "$crit" -gt "$base" ]; then regressions=$((regressions + 1)); fi
          done < /tmp/images.txt
          test "$regressions" -eq 0
