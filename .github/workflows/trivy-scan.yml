name: Trivy Image Security Scan
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Severity threshold"
        required: false
        default: "CRITICAL,HIGH"
        type: choice
        options:
          - "CRITICAL,HIGH"
          - CRITICAL
          - "CRITICAL,HIGH,MEDIUM"
      quick:
        description: "Quick scan (IaC only, skip image CVE scan)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".github/workflows/trivy-scan.yml"
      - "scripts/trivy-scan.sh"
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - ".github/workflows/trivy-scan.yml"
      - "scripts/trivy-scan.sh"
  schedule:
    # Weekly scan (Sunday 2 AM UTC)
    - cron: "0 2 * * 0"

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan Images for CVEs
    if: ${{ github.event.inputs.quick != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Extract images from docker-compose.yml
        id: images
        run: |
          grep -oP '^\s+image:\s+\K[^\s@\n]+' docker-compose.yml | sort -u > /tmp/images.txt
          echo "Found $(wc -l < /tmp/images.txt) images"
          cat /tmp/images.txt

      - name: Scan all images and gate on CRITICAL
        run: |
          CRITICAL_TOTAL=0
          HIGH_TOTAL=0
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::Scanning $image"
            SEVERITY="${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}"
            RESULT=$(trivy image --scanners vuln --format json --severity "$SEVERITY" "$image" 2>/dev/null || echo '{}')
            CRIT=$(echo "$RESULT" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' 2>/dev/null || echo 0)
            HIGH=$(echo "$RESULT" | jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' 2>/dev/null || echo 0)
            CRITICAL_TOTAL=$((CRITICAL_TOTAL + CRIT))
            HIGH_TOTAL=$((HIGH_TOTAL + HIGH))
            echo "  CRITICAL: $CRIT, HIGH: $HIGH (running total: C=$CRITICAL_TOTAL H=$HIGH_TOTAL)"
            echo "::endgroup::"
          done < /tmp/images.txt
          echo "=== TOTAL: CRITICAL=$CRITICAL_TOTAL HIGH=$HIGH_TOTAL ==="
          SEVERITY="${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}"
          if [ "$SEVERITY" = "CRITICAL" ]; then
            # Only gate on CRITICAL when severity is CRITICAL-only
            GATE_COUNT=$CRITICAL_TOTAL
          else
            # Gate on CRITICAL (always) regardless of HIGH/MEDIUM
            GATE_COUNT=$CRITICAL_TOTAL
          fi
          if [ "$GATE_COUNT" -gt 0 ]; then
            echo "❌ $CRITICAL_TOTAL CRITICAL CVEs detected across all images"
            exit 1
          else
            echo "✅ No CRITICAL CVEs found"
            exit 0
          fi

      - name: Fix Trivy cache permissions for post-step save
        if: always()
        run: sudo chmod -R a+r trivy-cache/ 2>/dev/null || true

  trivy-config:
    runs-on: ubuntu-latest
    name: Scan IaC Config (Dockerfiles)
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy IaC scan (Dockerfiles)
        # `trivy config` rejects multiple targets in one invocation, so each
        # Dockerfile is scanned separately and the job fails if any one of them
        # reports HIGH/CRITICAL findings. The repo-root `.trivyignore` lists the
        # currently-deferred checks (e.g. DS-0002, pending the non-root USER
        # work in improvement item 7). docker-compose.yml is deliberately not a
        # trivy "config" target here: Trivy's IaC scanner detects 0 files for it,
        # so scanning it would be a silent no-op.
        run: |
          set -euo pipefail
          fail=0
          for df in services/metacache/Dockerfile \
                    services/control-panel/django/Dockerfile \
                    services/nzbdav-exporter/Dockerfile; do
            echo "::group::Trivy IaC scan: $df"
            SEVERITY="${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}"
            trivy config --severity "$SEVERITY" --exit-code 1 "$df" \
              || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Trivy IaC scan found HIGH/CRITICAL misconfigurations."
            exit 1
          fi
          echo "IaC scan clean — no HIGH/CRITICAL misconfigurations."

  report:
    runs-on: ubuntu-latest
    name: Generate CVE Report
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: scan
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Generate report
        run: |
          {
            echo "# CVE Baseline Report"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
          } > STAGE-4-CVE-BASELINE.md
          grep -oP '^\s+image:\s+\K[^\s@\n]+' docker-compose.yml | sort -u | while read -r image; do
            {
              echo "## $image"
              trivy image --severity CRITICAL,HIGH --format table "$image" 2>/dev/null || echo "Scan failed"
              echo ""
            } >> STAGE-4-CVE-BASELINE.md
          done

      - name: Commit report
        run: |
          git config user.name "Trivy Scanner Bot"
          git config user.email "trivy@bot.local"
          git add STAGE-4-CVE-BASELINE.md || true
          if ! git diff --cached --quiet; then
            git commit -m "docs: update CVE baseline scan report"
            git push
          else
            echo "Report unchanged - no commit needed"
          fi
