name: Trivy Image Security Scan
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  workflow_dispatch:
    inputs:
      severity:
        description: "Severity threshold"
        required: false
        default: "CRITICAL,HIGH"
        type: choice
        options:
          - "CRITICAL,HIGH"
          - CRITICAL
          - "CRITICAL,HIGH,MEDIUM"
      quick:
        description: "Quick scan (IaC only, skip image CVE scan)"
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - "docker-compose.yml"
      - ".github/workflows/trivy-scan.yml"
      - "scripts/trivy-scan.sh"
  push:
    branches:
      - main
    paths:
      - "docker-compose.yml"
      - ".github/workflows/trivy-scan.yml"
      - "scripts/trivy-scan.sh"
  schedule:
    # Weekly scan (Sunday 2 AM UTC)
    - cron: "0 2 * * 0"

jobs:
  scan:
    runs-on: ubuntu-latest
    name: Scan Images for CVEs
    if: ${{ github.event.inputs.quick != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Extract images from docker-compose.yml
        id: images
        run: |
          grep -oP '^\s+image:\s+\K[^\s\n]+' docker-compose.yml | sort -u > /tmp/images.txt
          echo "Found $(wc -l < /tmp/images.txt) images"
          cat /tmp/images.txt

      - name: Scan all images and gate on CRITICAL regression
        run: |
          BASELINE_FILE=".github/trivy-baseline.json"
          CRITICAL_TOTAL=0
          HIGH_TOTAL=0
          REGRESS=0
          : > /tmp/regressions.txt
          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "::group::Scanning $image"
            SEVERITY="${{ github.event.inputs.severity || 'CRITICAL,HIGH' }}"
            # --ignore-unfixed drops CRITICALs with no upstream fix yet
            # (e.g. host-kernel / base-mariadb CVEs on floating tags that are
            # already at their newest release). Only fixable CRITICALs count.
            RESULT=$(trivy image --ignore-unfixed --scanners vuln --format json --severity "$SEVERITY" "$image" 2>/dev/null || echo '{}')
            CRIT=$(echo "$RESULT" | jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' 2>/dev/null); CRIT=${CRIT:-0}
            HIGH=$(echo "$RESULT" | jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' 2>/dev/null); HIGH=${HIGH:-0}
            CRITICAL_TOTAL=$((CRITICAL_TOTAL + CRIT))
            HIGH_TOTAL=$((HIGH_TOTAL + HIGH))
            # Regression gate: fail if this image reports more fixable
            # CRITICALs than its committed baseline. Missing entry = 0, so a
            # newly-added image with any CRITICAL is a regression.
            if [ -f "$BASELINE_FILE" ]; then
              BASE=$(jq -r --arg img "$image" '.images[$img] // 0' "$BASELINE_FILE")
            else
              BASE=0
            fi
            if [ "$CRIT" -gt "$BASE" ]; then
              echo "$image: CRIT=$CRIT exceeds baseline=$BASE" >> /tmp/regressions.txt
              REGRESS=$((REGRESS + CRIT - BASE))
            fi
            echo "  CRITICAL: $CRIT, HIGH: $HIGH (baseline=$BASE, total C=$CRITICAL_TOTAL H=$HIGH_TOTAL)"
            echo "::endgroup::"
          done < /tmp/images.txt
          echo "=== TOTAL: CRITICAL=$CRITICAL_TOTAL HIGH=$HIGH_TOTAL ==="
          if [ "$REGRESS" -gt 0 ]; then
            echo "❌ CRITICAL regression versus baseline ($BASELINE_FILE):"
            cat /tmp/regressions.txt
            exit 1
          else
            echo "✅ No CRITICAL regression versus baseline."
            exit 0
          fi

      - name: Fix Trivy cache permissions for post-step save
        if: always()
        run: sudo chmod -R a+r trivy-cache/ 2>/dev/null || true

  trivy-config:
    runs-on: ubuntu-latest
    name: Scan IaC Config (Dockerfiles)
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Trivy IaC scan (Dockerfiles)
        # `trivy config` rejects multiple targets in one invocation, so each
        # Dockerfile is scanned separately and the job fails if any one of them
        # reports HIGH/CRITICAL findings. The repo-root `.trivyignore` lists the
        # currently-deferred checks. docker-compose.yml is deliberately not a
        # trivy "config" target here: Trivy's IaC scanner detects 0 files for it,
        # so scanning it would be a silent no-op.
        run: |
          set -euo pipefail
          fail=0
          for df in services/metacache/Dockerfile \
                    services/nzbdav-exporter/Dockerfile; do
            echo "::group::Trivy IaC scan: $df"
            SEVERITY="${{ github.event.inputs.severity || 'HIGH,CRITICAL' }}"
            trivy config --severity "$SEVERITY" --exit-code 1 "$df" \
              || fail=1
            echo "::endgroup::"
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Trivy IaC scan found HIGH/CRITICAL misconfigurations."
            exit 1
          fi
          echo "IaC scan clean — no HIGH/CRITICAL misconfigurations."

  report:
    runs-on: ubuntu-latest
    name: Generate CVE Report
    # Only record a new baseline when the gate passes; a failing scan must
    # never be auto-approved by re-committing a worse baseline.
    if: ${{ success() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule') }}
    needs: scan
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Trivy
        run: |
          sudo apt-get update && sudo apt-get install -y wget apt-transport-https
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | gpg --dearmor | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | sudo tee /etc/apt/sources.list.d/trivy.list
          sudo apt-get update && sudo apt-get install -y trivy

      - name: Generate report
        run: |
          {
            echo "# CVE Baseline Report"
            echo ""
            echo "Generated: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
          } > STAGE-4-CVE-BASELINE.md
          grep -oP '^\s+image:\s+\K[^\s\n]+' docker-compose.yml | sort -u | while read -r image; do
            {
              echo "## $image"
              trivy image --ignore-unfixed --severity CRITICAL,HIGH --format table "$image" 2>/dev/null || echo "Scan failed"
              echo ""
            } >> STAGE-4-CVE-BASELINE.md
          done

      - name: Generate machine-readable baseline
        # Per-image fixable CRITICAL count, matching the scan gate's
        # --ignore-unfixed semantics. The .md is human-readable; this JSON is
        # what the gate diffs against on the next run.
        run: |
          grep -oP '^\s+image:\s+\K[^\s\n]+' docker-compose.yml | sort -u | while read -r img; do
            [ -z "$img" ] && continue
            C=$(trivy image --ignore-unfixed --scanners vuln --format json --severity CRITICAL "$img" 2>/dev/null | jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length')
            C=${C:-0}
            printf '%s\t%s\n' "$img" "$C"
          done > /tmp/baseline_pairs.tsv
          jq -Rs 'split("\n") | map(select(length>0)) | map(split("\t")) | map({(.[0]): (.[1]|tonumber)}) | add | {description: "Per-image Trivy CRITICAL counts using --ignore-unfixed. The scan gate fails when a compose-listed image reports a higher count than here.", images: .}' /tmp/baseline_pairs.tsv > .github/trivy-baseline.json
          echo "Wrote .github/trivy-baseline.json"
          jq . .github/trivy-baseline.json

      - name: Commit report
        run: |
          git config user.name "Trivy Scanner Bot"
          git config user.email "trivy@bot.local"
          git add STAGE-4-CVE-BASELINE.md .github/trivy-baseline.json || true
          if ! git diff --cached --quiet; then
            git commit -m "docs: update CVE baseline scan report"
            # Another push (e.g. release-please) can land during the scan;
            # rebase onto it so the push is not rejected as non-fast-forward.
            git pull --rebase origin main
            git push
          else
            echo "Report unchanged - no commit needed"
          fi
