name: PR Labeler
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  size-label:
    name: Label PR by size
    runs-on: ubuntu-latest
    steps:
      - uses: codelytv/pr-size-labeler@095a41fca88b8764fd9e008ad269bcdb82bb38b9 # v1
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_max_size: 10
          s_max_size: 100
          m_max_size: 500
          l_max_size: 1000
          fail_if_xl: false
          message_if_xl: >
            ⚠️ This PR is very large and exceeds the XL size limit.
            Consider breaking it into smaller, focused PRs for easier review.

  path-label:
    name: Label PR by changed paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
          sync-labels: true
