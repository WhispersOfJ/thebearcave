name: PR Title Lint

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Conventional Commits
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[^ ].+$
          subjectPatternError: |
            The subject "{subject}" must not start with a space.
          headerPatternError: |
            The PR title "{title}" does not follow Conventional Commits.
            Format: `type(scope): description`
            Example: `feat(metacache): add predictive warming for next episode`
            Types: feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert
