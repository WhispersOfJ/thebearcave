name: Validate
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "archive/**"
      - "config/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "archive/**"
      - "config/**"
  workflow_dispatch:
    inputs:
      skip_actionlint:
        description: "Skip actionlint workflow lint"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create dummy .env
        run: cp .env.template .env

      - name: Validate docker-compose.yml
        run: docker compose config --quiet

      - name: Check for merged mount/port/env entries in docker-compose.yml
        run: python3 scripts/check_compose_mounts.py

      - name: Check every compose ${VAR} has a .env.template key
        run: |
          comm -23 \
            <(grep -ohE '\$\{[A-Z_0-9]+' docker-compose.yml | sed 's/^\${//' | sort -u) \
            <(grep -E '^[A-Z_0-9]+=' .env.template | cut -d= -f1 | sort -u) \
            > missing_vars.txt
          if [ -s missing_vars.txt ]; then
            echo "Vars referenced in docker-compose.yml but missing from .env.template:"
            cat missing_vars.txt
            exit 1
          fi

      - name: Shellcheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: warning
          scandir: "."
          ignore_paths: "archive config services data media"

      - name: Ruff (Python lint)
        run: |
          pip install ruff==0.8.6
          ruff check . --exclude archive/ --exclude "**/migrations"

      - name: Bash syntax checks
        run: |
          for f in scripts/*.sh tests/*/*.sh; do
            echo "Checking $f..."
            bash -n "$f"
          done

      - name: Fish functions checks
        run: |
          # fish 4.x from the official fish-shell PPA — must match the version
          # the functions/completions are formatted and tested with locally.
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update -qq
          sudo apt-get install -y -qq fish
          fish --version
          for f in services/fish-functions/functions/*.fish \
                   services/fish-functions/completions/*.fish \
                   services/fish-functions/scripts/gen-completions.fish; do
            fish --no-execute "$f"
            fish_indent --check "$f"
          done
          # completions/ must be current with function descriptions/arg tables
          fish services/fish-functions/scripts/gen-completions.fish --check
          # static smoke tier: load/define + completion registration checks
          ./tests/fish/test_fish_functions.sh --offline

      - name: Actionlint (workflow lint)
        if: ${{ github.event.inputs.skip_actionlint != 'true' }}
        run: |
          # v1.7.12 pinned — to upgrade, bump the version here and the
          # sha256 checksum, then re-run validate.
          ACTIONLINT_VERSION="1.7.12"
          curl -sSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  /tmp/actionlint.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml

      - name: Unit tests - nzbdav-exporter
        run: |
          pip install pytest requests prometheus_client
          cd services/nzbdav-exporter
          python -m pytest test_exporter.py -v
