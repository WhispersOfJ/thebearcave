name: Secret Manifest Guard
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


# Fails when workflows use GitHub secrets that are not declared in
# .github/required-secrets.json, or when a manifest secret's env_var is
# missing from .env.template. Keeps the manifest, .env.template, and
# workflow secret usage from drifting apart.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check secret manifest vs workflows and .env.template
        run: python3 scripts/check_secret_manifest.py
