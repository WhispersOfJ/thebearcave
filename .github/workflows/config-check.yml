name: Config Check
# Path-scoped validation for tracked config/ content that validate.yml skips
# (its paths-ignore includes config/**). Dashboard JSON must be a valid,
# un-wrapped dashboard model or the provisioning provider silently rejects it
# ("Dashboard title cannot be empty" on every rescan).

on:
  push:
    branches: ["main"]
    paths:
      - "config/grafana/**"
  pull_request:
    branches: ["main"]
    paths:
      - "config/grafana/**"

permissions:
  contents: read

jobs:
  dashboards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Grafana dashboard JSON is valid and un-wrapped
        run: python3 scripts/check_grafana_dashboards.py
