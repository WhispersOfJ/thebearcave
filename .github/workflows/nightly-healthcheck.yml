name: Nightly Health Check
# Pinned actions policy: third-party actions are pinned to full commit SHAs
# (a mutable tag could be retargeted). The trailing "# tag" marks the version.
# To upgrade: gh api repos/{owner}/{repo}/commits/{new-tag} --jq .sha, then
# update the SHA and the "# tag" comment on its uses: line.


on:
  schedule:
    - cron: "0 3 * * *" # daily at 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-validate:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create dummy .env
        run: cp .env.template .env

      - name: Validate compose
        run: docker compose config --quiet

      - name: Verify all referenced config files exist
        run: |
          MISSING=0
          # Check that every bind-mounted path in compose actually exists
          grep -oP '\./[^\s:]+' docker-compose.yml | sort -u | while read -r path; do
            # Skip paths that are only created at runtime
            case "$path" in
              ./media/*|./data/*|./logs/*|./services/*/config) continue ;;
            esac
            if [ ! -e "$path" ]; then
              echo "MISSING: $path"
              MISSING=$((MISSING + 1))
            fi
          done
          if [ "$MISSING" -gt 0 ]; then
            echo "❌ $MISSING referenced paths missing"
            exit 1
          fi

  dockerfile-validate:
    name: Dockerfile Build Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        context:
          - services/metacache
          - services/nzbdav-exporter
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build ${{ matrix.context }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ matrix.context }}:nightly-check
          cache-from: type=gha

  script-syntax:
    name: Script Syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bash syntax check
        run: |
          for f in scripts/*.sh tests/*/*.sh; do
            echo "Checking $f..."
            bash -n "$f"
          done

      - name: YAML lint
        run: |
          pip install yamllint
          # Keep relaxed for structure checks but disable line-length: it is
          # stylistic (actionlint is the real workflow gate), half the
          # workflows legitimately exceed 80 cols, and recent yamllint
          # versions fail on warnings, which broke this step nightly.
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            docker-compose.yml \
            .github/workflows/*.yml \
            .github/dependabot.yml \
            config/traefik/traefik.yml \
            services/loki/loki-config.yaml \
            services/promtail/promtail-config.yaml \
            services/prometheus/prometheus.yml

  update-guard:
    name: nzbdav Update Guard Script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The guard script cannot run for real here (no home stack access), so
      # exercise its CLI contract and its drift-sensitive assumptions instead.
      - name: CLI contract
        run: |
          [ -x scripts/update-nzbdav.sh ] || { echo "❌ not executable"; exit 1; }
          ./scripts/update-nzbdav.sh --help | grep -q -- '--dry-run'
          if ./scripts/update-nzbdav.sh --bogus >/dev/null 2>&1; then
            echo "❌ unknown option was accepted"
            exit 1
          fi

      # The script waits on a hardcoded DEPENDENTS list; compose decides the
      # real cascade via depends_on.nzbdav_rclone.restart: true. If one changes
      # without the other, the update script's health waits are wrong.
      - name: Dependents list matches compose cascade
        run: |
          python3 - <<'EOF'
          import re
          import sys

          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml unavailable on runner")

          compose = yaml.safe_load(open("docker-compose.yml"))
          cascaded = set()
          for name, svc in compose.get("services", {}).items():
              deps = svc.get("depends_on") or {}
              rclone = deps.get("nzbdav_rclone") if isinstance(deps, dict) else None
              if isinstance(rclone, dict) and rclone.get("restart") is True:
                  cascaded.add(name)
          if not cascaded:
              sys.exit("no restart:true cascade found off nzbdav_rclone in compose")

          script = open("scripts/update-nzbdav.sh").read()
          m = re.search(r"^DEPENDENTS=\((.*)\)", script, re.M)
          if not m:
              sys.exit("DEPENDENTS array not found in scripts/update-nzbdav.sh")
          declared = set(m.group(1).split())

          if cascaded != declared:
              sys.exit(
                  f"drift: compose cascades {sorted(cascaded)}, "
                  f"update-nzbdav.sh waits for {sorted(declared)}"
              )
          print(f"update-nzbdav.sh dependents match compose cascade: {sorted(declared)}")
          EOF

  mount-drift:
    name: Mount Drift Guard Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create dummy .env
        run: cp .env.template .env

      # The guard probes live containers, so it cannot run for real on a
      # GitHub runner; exercise its contract and its drift-sensitive
      # assumptions instead (same precedent as the update-guard job). The
      # live-stack run happens daily on the host via the
      # mount-drift-check.timer user timer -> scripts/check_mount_drift_daily.sh.
      - name: Guard script compiles and runs clean with no containers
        run: |
          python3 -m py_compile scripts/check_mount_drift.py
          python3 scripts/check_mount_drift.py

      # If compose moves the FUSE mount path and the script's FUSE_MOUNTS
      # table is not updated, the stale-handle probe silently stops covering
      # it. Keep the two in lockstep.
      - name: FUSE mount table matches compose
        run: |
          python3 - <<'EOF'
          import re
          import sys

          try:
              import yaml
          except ImportError:
              sys.exit("pyyaml unavailable on runner")

          compose = yaml.safe_load(open("docker-compose.yml"))
          fuse = set()
          for svc in compose.get("services", {}).values():
              for v in svc.get("volumes") or []:
                  if isinstance(v, str) and v.split(":")[0].startswith("/mnt/remote"):
                      fuse.add(v.split(":")[0].rstrip("/"))

          script = open("scripts/check_mount_drift.py").read()
          m = re.search(r"FUSE_MOUNTS = \{(.*?)\}", script, re.S)
          if not m:
              sys.exit("FUSE_MOUNTS table not found in scripts/check_mount_drift.py")
          declared = set(re.findall(r'"([^"]+)"\s*:', m.group(1)))

          if fuse != declared:
              sys.exit(
                  f"drift: compose FUSE sources {sorted(fuse)} != "
                  f"script FUSE_MOUNTS {sorted(declared)}"
              )
          print(f"mount-drift FUSE table matches compose: {sorted(declared)}")
          EOF

  env-coverage:
    name: Env Var Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create dummy .env
        run: cp .env.template .env

      - name: Check every compose ${VAR} has a .env.template key
        run: |
          MISSING=$(comm -23 \
            <(grep -ohE '\$\{[A-Z_0-9:-]+' docker-compose.yml | sed 's/^\${//' | sed 's/:-.*//' | sort -u) \
            <(grep -E '^[A-Z_0-9]+=' .env.template | cut -d= -f1 | sort -u))
          if [ -n "$MISSING" ]; then
            echo "❌ Vars referenced in docker-compose.yml but missing from .env.template:"
            echo "$MISSING"
            exit 1
          fi
          echo "✅ All compose vars covered in .env.template"

  backup-restore:
    name: Backup Restore Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # backup.sh --configs-only warns (not fails) when .env is absent, so no
      # dummy .env is needed here — and the test's placeholder check expects
      # none. Only the tracked config/ tree exists in CI, keeping the copy fast.
      - name: Run backup-restore test
        run: bash tests/integration/test_backup_restore.sh
