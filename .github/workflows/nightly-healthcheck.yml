name: Nightly Health Check
# Nightly validation for the eight-service stack.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-validate:
    name: Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create dummy .env
        run: cp .env.template .env
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Check referenced paths
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            case "$path" in
              # media/data/logs are content mounts; config/* is gitignored
              # host state (config/ca CA bundle, app config dirs); ./usenet
              # is the download mount — none exist in the CI checkout and
              # must not fail the gate (usenet sorts after config/ca, so it
              # was masked by the ca failure until now).
              ./media/*|./data/*|./logs/*|./config/*|./usenet) continue ;;
            esac
            test -e "$path" || { echo "MISSING: $path"; exit 1; }
          done < <(grep -oP '\./[^\s:]+' docker-compose.yml | sort -u)

  script-validation:
    name: Script and Guard Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: the config-drift guard test resolves pin-change
          # dates via `git log -S` against docker-compose.yml.
          fetch-depth: 0
      - name: Bash syntax and guard tests
        run: |
          for f in scripts/*.sh scripts/git-hooks/* tests/*/*.sh \
                   services/bash-functions/waybar/scripts/*.sh; do bash -n "$f"; done
          python3 -m py_compile scripts/*.py
          python3 scripts/test_check_compose_mounts.py
          python3 scripts/test_check_nzbdav_queue.py
          python3 scripts/test_check_bind_mount_staleness.py
          python3 scripts/test_check_radarr_profiles.py
          python3 scripts/test_check_radarr_db_size.py
          python3 scripts/test_prune_radarr_db.py
          python3 scripts/test_prune_sonarr_db.py
          python3 scripts/test_check_sonarr_refs.py
          python3 scripts/test_check_prowlarr_refs.py
          python3 scripts/test_check_secret_drift.py
          python3 scripts/test_check_python_env_transports.py
          python3 scripts/test_check_stack_tui.py
          python3 scripts/test_reclaim_docker_disk.py
          python3 scripts/test_maintenance_digest.py
          python3 scripts/test_db_growth_trend.py
          python3 scripts/test_audit_residue.py
          python3 scripts/test_check_config_drift.py
          python3 scripts/test_check_arr_import_queue.py
          python3 scripts/test_check_waybar_drift.py
          python3 scripts/test_alias_candidates.py
          python3 scripts/check_secret_drift.py
          python3 scripts/check_nzbdav_queue.py --offline
          python3 scripts/check_bind_mount_staleness.py --offline
          python3 scripts/check_waybar_drift.py --offline
          python3 scripts/test_drain_sonarr_queue.py
          python3 scripts/test_search_missing_scoped.py
          python3 scripts/test_arrival_notifier.py
          python3 scripts/test_activity_feed.py
          python3 scripts/test_backup_dropbox.py
          bash scripts/test_setup.sh
          python3 scripts/test_check_compose_commands.py
      - name: YAML lint
        run: |
          pip install yamllint==1.37.1
          yamllint -d "{extends: relaxed, rules: {line-length: disable}}" \
            docker-compose.yml .github/workflows/*.yml .github/dependabot.yml

  env-coverage:
    name: Environment Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Compose variables
        run: |
          MISSING=$(comm -23 \
            <(grep -ohE '\$\{[A-Z_0-9:-]+' docker-compose.yml | sed 's/^\${//' | sed 's/:-.*//' | sort -u) \
            <(grep -E '^[A-Z_0-9]+=' .env.template | cut -d= -f1 | sort -u))
          test -z "$MISSING" || { echo "$MISSING"; exit 1; }

  update-guard:
    name: NzbDAV Update Guard Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: CLI contract
        run: |
          test -x scripts/update-nzbdav.sh
          ./scripts/update-nzbdav.sh --help | grep -q -- '--dry-run'
          ! ./scripts/update-nzbdav.sh --bogus >/dev/null 2>&1
      - name: Dependency cascade contract
        run: |
          python3 - <<'EOF'
          import re
          import subprocess
          import yaml
          compose = yaml.safe_load(subprocess.check_output(["docker", "compose", "config"]))
          cascaded = set()
          for name, svc in compose["services"].items():
              dep = (svc.get("depends_on") or {}).get("nzbdav_rclone")
              if isinstance(dep, dict) and dep.get("restart") is True:
                  cascaded.add(name)
          script = open("scripts/update-nzbdav.sh").read()
          declared = set(re.search(r"^DEPENDENTS=\((.*)\)", script, re.M).group(1).split())
          assert cascaded == declared, (cascaded, declared)
          print(sorted(declared))
          EOF
