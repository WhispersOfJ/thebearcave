compose:
  - changed-files:
      - any-glob-to-any-file:
          - docker-compose.yml
          - docker-compose.*.yml

traefik:
  - changed-files:
      - any-glob-to-any-file:
          - config/traefik/**

metacache:
  - changed-files:
      - any-glob-to-any-file:
          - services/metacache/**

control-panel:
  - changed-files:
      - any-glob-to-any-file:
          - services/control-panel/**

monitoring:
  - changed-files:
      - any-glob-to-any-file:
          - services/grafana/**
          - services/prometheus/**
          - services/loki/**
          - services/promtail/**

nzbdav:
  - changed-files:
      - any-glob-to-any-file:
          - services/nzbdav/**
          - services/nzbdav-rclone/**
          - services/nzbdav-exporter/**

scripts:
  - changed-files:
      - any-glob-to-any-file:
          - scripts/**
          - tests/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

docs:
  - changed-files:
      - any-glob-to-any-file:
          - docs/**
          - "*.md"
          - archive/**
