name: Bug Report
description: Report a bug or unexpected behavior
title: "fix: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bug Report

        Include the service, relevant logs, and whether the NzbDAV queue and FUSE mount were healthy.

  - type: dropdown
    id: service
    attributes:
      label: Affected Service
      options:
        - Plex
        - InfiniDysk (NzbDAV)
        - nzbdav_rclone (FUSE mount)
        - Radarr
        - Sonarr
        - Prowlarr
        - Seerr
        - Unpackerr
        - Docker Compose / Startup
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened and what did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste relevant logs; remove credentials and tokens.
      render: shell

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Docker/Compose versions, and commit.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Low (cosmetic/minor)
        - Medium (degraded but functional)
        - High (service down/broken)
        - Critical (data loss/security)
    validations:
      required: true
